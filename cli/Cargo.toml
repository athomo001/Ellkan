[package]
name = "ellkan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
cel-interpreter = "0.10.0"
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
ellkan-crypto = { version = "0.1.0", path = "../crates/ellkan-crypto" }
# `rustls-tls` en vez de `default-tls` (native-tls) — F-35 mTLS necesita
# `Identity::from_pem` (cert+key PEM concatenados), que sólo existe bajo
# rustls; con native-tls habría que empaquetar PKCS#12 en vez de PEM.
reqwest = { version = "0.13.4", features = ["json", "blocking", "rustls"] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.0"
