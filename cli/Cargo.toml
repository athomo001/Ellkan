[package]
name = "ellkan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
cel-interpreter = "0.10.0"
clap = { version = "4.6.5", features = ["derive"] }
dirs = "6.0.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
ellkan-crypto = { version = "0.1.0", path = "../crates/ellkan-crypto" }
# `rustls-tls` en vez de `default-tls` (native-tls) — F-35 mTLS necesita
# `Identity::from_pem` (cert+key PEM concatenados), que sólo existe bajo
# rustls; con native-tls habría que empaquetar PKCS#12 en vez de PEM.
reqwest = { version = "0.13.4", features = ["json", "blocking", "rustls"] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# F-28/F-41: los comandos de mantenimiento (`datacheck`/`cleanup`/
# `promote-to-admin`/`recover-setup`/`backup`) rompen a propósito el patrón
# "CLI = 100% cliente HTTP" del resto del binario — exigen acceso directo a
# Postgres, mismo nivel de confianza que el propio backup (spec
# `03-api-contrato.md`: "quien puede ejecutar esto ya tiene control total
# de la infraestructura"). Sin feature `migrate` (el CLI nunca migra, sólo
# el backend) ni `json` (no se usa `sqlx::types::Json` acá).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros"] }
# Runtime mínimo sólo para los comandos de arriba — el resto de la CLI
# sigue siendo síncrona (`reqwest::blocking`), cada handler nuevo abre su
# propio runtime de un solo hilo en vez de convertir todo `main()` a async.
tokio = { version = "1.48.0", features = ["rt", "time"] }
# F-28: cifrado obligatorio del artefacto de backup, streaming, a una clave
# pública de operaciones — `age` es justo el ejemplo que cita la spec
# (`pg_dump | age -r <clave> > archivo.age`), no GPG (00-principios-y-alcance.md
# ya descarta interoperabilidad GPG para el vault, esto es un uso distinto:
# cifrado de un artefacto de infraestructura, no del modelo criptográfico
# de usuario).
age = { version = "0.12.1", features = ["armor"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
zeroize = "1.9.0"
