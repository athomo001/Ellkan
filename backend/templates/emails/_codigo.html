<!--
Autor: Athan Espinoza

Partial compartido por los 4 correos que llevan un código de 6 dígitos —
aislado en su propia celda, tipografía monoespaciada grande con
letter-spacing: no es sólo estética, es lo que hace que Gmail/Apple Mail
detecten el número como código y ofrezcan copiarlo con un toque (esos
clientes buscan un número corto aislado, cerca de la palabra "código", sin
otros dígitos alrededor que confundan la heurística).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0;">
<tr>
<td align="center" style="background-color:#102335; border-radius:8px; padding:18px 24px;">
<span style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; font-size:32px; font-weight:700; letter-spacing:8px; color:#E0B860;">{{ codigo }}</span>
</td>
</tr>
</table>
