<!--
Autor: Athan Espinoza

Partial compartido por correos con un link de acción (hoy sólo
recovery_kit_reset_requested) — botón real + el link en texto plano debajo
como fallback, porque algunos clientes recortan o no renderizan el botón.
Variables esperadas en el contexto: `link`, `boton_texto`.
-->
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:20px 0;">
<tr>
<td align="center" style="border-radius:8px; background-color:#187890;">
<a href="{{ link }}" style="display:inline-block; padding:14px 28px; font-size:15px; font-weight:600; color:#FFFFFF; text-decoration:none; border-radius:8px;">{{ boton_texto }}</a>
</td>
</tr>
</table>
<p style="font-size:12px; color:#7A8794; word-break:break-all; margin:12px 0 0;">{{ link }}</p>
