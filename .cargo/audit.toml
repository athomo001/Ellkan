# Autor: Athan Espinoza

# Excepciones documentadas al gate transversal `cargo audit` — cada entrada
# acá exige una justificación real de por qué la vulnerabilidad no aplica al
# uso concreto que Ellkan hace de esa dependencia, nunca un silenciamiento
# sin motivo. Ver `spec/05-plan-de-implementacion.md` sección 1.2 (F-03) para
# el contexto completo de esta excepción puntual.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 ("Marvin Attack", canal lateral de timing en
    # operaciones RSA con la clave PRIVADA) — `rsa` llega vía `crypto-glue`,
    # dependencia obligatoria (no gateable por feature) de
    # `webauthn-rs-core`/`webauthn-attestation-ca` para soportar RS256 en
    # claves COSE. Ellkan, como Relying Party WebAuthn, sólo VERIFICA firmas
    # con la clave PÚBLICA del autenticador — nunca posee ni opera con una
    # clave privada RSA, así que el canal lateral de timing (que exige una
    # operación con la clave privada) no es alcanzable en este uso. Sin
    # versión corregida disponible todavía en `rsa` — revisar esta excepción
    # cuando exista un fix.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387 (2026-10-26, `crypto-bigint` 0.5.5: ramas que
    # dependen del secreto en resta, división y Montgomery) — llega sólo vía
    # `elliptic-curve` 0.13 → `p256`/`p384`/`p521`, y el fix existe recién en
    # 0.7.6 (otra serie, sin backport). Usos reales: verificar firmas WebAuthn
    # (`crypto-glue`) y el `id_token` OIDC (`openidconnect`), ambos con clave
    # PÚBLICA, y `age` en la CLI sólo con recipientes x25519 (curve25519-dalek,
    # no `crypto-bigint`). Ninguna operación con secreto pasa por estas
    # curvas. Revisar cuando `webauthn-rs`/`openidconnect` pasen a
    # `elliptic-curve` 0.14.
    "RUSTSEC-2026-0387",
]
