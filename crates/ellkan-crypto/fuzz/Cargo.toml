[package]
name = "ellkan-crypto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
secrecy = "0.10.3"

[dependencies.ellkan-crypto]
path = ".."

[[bin]]
name = "aead_descifrar"
path = "fuzz_targets/aead_descifrar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sellado_abrir_dek"
path = "fuzz_targets/sellado_abrir_dek.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clave_privada_blob"
path = "fuzz_targets/clave_privada_blob.rs"
test = false
doc = false
bench = false
