# Autor: Athan Espinoza
#
# Pendiente #80: cadena de suministro de Rust con `cargo deny`. Cubre
# licencias, crates prohibidos/duplicados y de dónde vienen. Las
# vulnerabilidades las sigue revisando `cargo audit` (excepciones en
# `.cargo/audit.toml`): un solo lugar para justificarlas.

[graph]
all-features = true

[licenses]
version = 2
# Licencias compatibles con distribuir Ellkan bajo AGPL-3.0-only. Una
# dependencia nueva con otra licencia hace fallar el CI hasta revisarla.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Dos versiones del mismo crate es común en el árbol (Tauri, sqlx): se avisa,
# no se frena.
multiple-versions = "warn"
# `version = "*"` en una dependencia publicada no deja reproducir el build.
# Los crates del workspace (path, `publish = false`) quedan permitidos.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Sólo crates.io: un registro o un repo git desconocido en el árbol es un
# cambio de cadena de suministro que alguien tiene que mirar.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
