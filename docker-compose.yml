# Autor: Athan Espinoza

# Único método de despliegue oficial. Secretos vía convención `*_FILE` —
# crear los archivos listados en `secrets:` bajo `./secrets/` (excluido de
# git) antes de levantar esto. Ver `secrets/README.md`.
services:
  ellkan:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ellkan
    ports:
      - "${ELLKAN_PORT:-8080}:${ELLKAN_PORT:-8080}"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      ELLKAN_SECRETS_KEY_FILE: /run/secrets/ellkan_secrets_key
      # Mismo valor que el lado host del mapeo de arriba — una sola
      # variable (`ELLKAN_PORT`, `.env`) controla los dos, nunca puede
      # desincronizarse entre sí.
      BIND_ADDR: "0.0.0.0:${ELLKAN_PORT:-8080}"
      # Prendido acá a propósito, no por default en el código (ver
      # `reparar_checksums_de_migraciones` en backend/src/lib.rs) — este
      # disco (NTFS/FUSE) ya hizo que un checksum de migración ya aplicada
      # dejara de coincidir con el archivo, sin que nadie tocara nada, y
      # sin esto el backend queda crasheando en loop para siempre.
      ELLKAN_MIGRATE_REPAIR_CHECKSUMS: "true"
    secrets:
      - database_url
      - ellkan_secrets_key
    depends_on:
      ellkan-db:
        condition: service_healthy
    restart: unless-stopped

  ellkan-db:
    image: "${POSTGRES_IMAGE:-postgres:18}"
    container_name: ellkan-db
    # Sólo en loopback (127.0.0.1), nunca 0.0.0.0 — esto es para que
    # `ellkan-cli admin ...` y operaciones de mantenimiento corran desde el
    # host (secrets/database_url.txt usa el hostname interno `ellkan-db`,
    # que sólo resuelve dentro de la red de Docker, no desde afuera). Ver
    # manual/cli.md para el DATABASE_URL que corresponde usar acá.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ellkan}"
      POSTGRES_USER: "${POSTGRES_USER:-ellkan}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # Postgres 18+ guarda los datos en subdirectorios versionados bajo
      # /var/lib/postgresql directamente (ya no .../data) — ver
      # https://github.com/docker-library/postgres/pull/1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ellkan} -d ${POSTGRES_DB:-ellkan}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

secrets:
  database_url:
    file: ./secrets/database_url.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  ellkan_secrets_key:
    file: ./secrets/ellkan_secrets_key.txt

volumes:
  postgres_data:
