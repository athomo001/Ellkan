# Autor: Athan Espinoza

# Único método de despliegue oficial. Secretos vía convención `*_FILE` —
# crear los archivos listados en `secrets:` bajo `./secrets/` (excluido de
# git) antes de levantar esto. Ver `secrets/README.md`.
services:
  ellkan:
    # Imagen publicada en cada release (GHCR). Con `image` y `build` juntos,
    # `docker compose up` primero intenta descargarla y sólo compila desde el
    # código si no la encuentra; `docker compose up -d --build` fuerza compilar.
    # `ELLKAN_VERSION` (en .env) elige la versión; por defecto, la última.
    image: "ghcr.io/athomo001/ellkan:${ELLKAN_VERSION:-latest}"
    # QA-44: el servidor termina lo que está haciendo hasta 20 s después de
    # `docker stop`; el default de Docker (10 s) lo mataría antes.
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ellkan
    ports:
      - "${ELLKAN_PORT:-8080}:${ELLKAN_PORT:-8080}"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      ELLKAN_SECRETS_KEY_FILE: /run/secrets/ellkan_secrets_key
      # Mismo valor que el lado host del mapeo de arriba — una sola
      # variable (`ELLKAN_PORT`, `.env`) controla los dos, nunca puede
      # desincronizarse entre sí.
      BIND_ADDR: "0.0.0.0:${ELLKAN_PORT:-8080}"
      # Dirección con la que se entra a Ellkan (passkeys y links de los
      # emails). Obligatorias: el servidor no arranca sin ellas (QA-30). En
      # producción, definilas en `.env` con tu dominio.
      ELLKAN_RP_ID: "${ELLKAN_RP_ID:-localhost}"
      ELLKAN_RP_ORIGIN: "${ELLKAN_RP_ORIGIN:-http://localhost:${ELLKAN_PORT:-8080}}"
      # QA-26: IPs o rangos de tu reverse proxy, para que los límites por IP
      # vean al cliente real (X-Forwarded-For). Vacío = no hay proxy delante.
      ELLKAN_TRUSTED_PROXIES: "${ELLKAN_TRUSTED_PROXIES:-}"
      # `ELLKAN_MIGRATE_REPAIR_CHECKSUMS` NO va acá: apaga la detección de
      # migraciones alteradas. Es una bandera de emergencia de un solo uso
      # (ver manual/instalacion.md, troubleshooting).
    # Los secretos se leen de un volumen de Docker que llena `ellkan-secretos`,
    # no de `./secrets` directo: en Docker Desktop (Windows) un archivo
    # montado desde el disco del host queda ilegible («Permission denied»)
    # si Docker se reinicia solo —p. ej. al despertar del Ahorro de recursos—
    # y vuelve a levantar este contenedor antes de que el disco esté listo.
    # El volumen vive dentro de Docker, así que ese reinicio no lo afecta.
    volumes:
      - ellkan_secretos:/run/secrets:ro
    depends_on:
      ellkan-secretos:
        condition: service_completed_successfully
      ellkan-db:
        condition: service_healthy
    restart: unless-stopped

  # Copia `./secrets/*.txt` al volumen `ellkan_secretos` y termina. Corre en
  # cada `docker compose up` (cambiar un secreto = editar el .txt + `up -d`);
  # el reinicio automático de Docker no lo vuelve a correr ni lo necesita.
  # Usa la imagen de Postgres porque ya está descargada y trae `sh`.
  ellkan-secretos:
    image: "${POSTGRES_IMAGE:-postgres:18}"
    container_name: ellkan-secretos
    entrypoint: ["sh", "-c"]
    # 65532 = usuario `nonroot` de la imagen distroless del servidor. Se
    # borra antes de copiar porque el archivo de la corrida anterior ya es
    # 0400 de 65532 y, sin DAC_OVERRIDE, root no puede sobrescribirlo; el
    # chmod va antes del chown porque, sin FOWNER, root sólo cambia el modo
    # de lo que es suyo.
    command:
      - >-
        set -e;
        cd /destino;
        rm -f database_url ellkan_secrets_key;
        cp /origen/database_url.txt database_url;
        cp /origen/ellkan_secrets_key.txt ellkan_secrets_key;
        chmod 0400 database_url ellkan_secrets_key;
        chown 65532:65532 database_url ellkan_secrets_key
    volumes:
      - ./secrets:/origen:ro
      - ellkan_secretos:/destino
    # Mínimo privilegio: sin red, sistema de archivos de sólo lectura (sólo
    # escribe en el volumen) y, de las capacidades de root, sólo CHOWN.
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  ellkan-db:
    image: "${POSTGRES_IMAGE:-postgres:18}"
    container_name: ellkan-db
    # Sólo en loopback (127.0.0.1), nunca 0.0.0.0 — esto es para que
    # `ellkan-cli admin ...` y operaciones de mantenimiento corran desde el
    # host (secrets/database_url.txt usa el hostname interno `ellkan-db`,
    # que sólo resuelve dentro de la red de Docker, no desde afuera). Ver
    # manual/cli.md para el DATABASE_URL que corresponde usar acá.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ellkan}"
      POSTGRES_USER: "${POSTGRES_USER:-ellkan}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # Postgres 18+ guarda los datos en subdirectorios versionados bajo
      # /var/lib/postgresql directamente (ya no .../data) — ver
      # https://github.com/docker-library/postgres/pull/1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ellkan} -d ${POSTGRES_DB:-ellkan}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  postgres_data:
  ellkan_secretos:
