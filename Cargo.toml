[workspace]
resolver = "2"
members = ["crates/ellkan-crypto", "backend", "cli", "app-escritorio/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/athomo001/Ellkan"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# QA-03: Argon2id con 64 MiB / t=3 sin optimizar tarda segundos por
# derivación y cada test de integración registra varias cuentas. Sólo estos
# crates se compilan optimizados en dev; el resto queda igual de depurable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
